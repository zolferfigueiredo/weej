name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check below needs main's history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          v=$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/core/version.go)
          tag=${GITHUB_REF#refs/tags/}
          if [ "$tag" != "v$v" ]; then
            echo "::error::Tag $tag does not match AppVersion $v in internal/core/version.go." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is not on main. Merge to main first, then run release.bat there." >&2
            exit 1
          fi
          echo "V=$v" >> "$GITHUB_ENV"

      - run: go test ./...
      - run: go run ./tools/mkicon winres
      - name: Make resources
        run: go tool go-winres make --in winres/winres.json --arch amd64 --product-version "$V.0" --file-version "$V.0"
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/WeeJ.exe .

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/WeeJ.exe, LICENSE -DestinationPath "dist/WeeJ-$env:V-x64.zip"

      # PowerShell, not bash: Git Bash would rewrite ISCC's /switches as paths.
      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:V" "/DSourceExe=..\dist\WeeJ.exe" installer\weej.iss'

      - name: Fixed-name copies, checksums and latest.json
        run: |
          cp "dist/WeeJ-$V-x64.zip" dist/WeeJ-x64.zip
          cp "dist/WeeJ-$V-x64-setup.exe" dist/WeeJ-x64-setup.exe
          sha256=$(sha256sum "dist/WeeJ-$V-x64.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s"}}\n' "$V" "$sha256" > dist/latest.json
          (cd dist && sha256sum "WeeJ-$V-x64.zip" "WeeJ-$V-x64-setup.exe" > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/WeeJ-$V-x64-setup.exe" \
            "dist/WeeJ-$V-x64.zip" \
            "dist/WeeJ-x64-setup.exe" \
            "dist/WeeJ-x64.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "WeeJ $V" --generate-notes
