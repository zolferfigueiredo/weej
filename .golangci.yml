version: "2"

linters:
  exclusions:
    presets:
      - std-error-handling
  default: standard
  enable:
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (*golang.org/x/sys/windows.LazyProc).Call
        - (*golang.org/x/sys/windows.Proc).Call

formatters:
  enable:
    - gofmt
    - goimports
