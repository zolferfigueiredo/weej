name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Determine the version to build
        run: |
          v=$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/core/version.go)
          # workflow_dispatch is a manual build-only run (an .exe and installer to try before
          # tagging a release), so there's no tag yet to check against AppVersion.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            tag=${GITHUB_REF#refs/tags/}
            if [ "$tag" != "v$v" ]; then
              echo "::error::Tag $tag does not match AppVersion $v in internal/core/version.go." >&2
              exit 1
            fi
          fi
          echo "V=$v" >> "$GITHUB_ENV"

      - run: go test ./...
      - run: go run ./tools/mkicon winres
      - name: Make resources
        run: go tool go-winres make --in winres/winres.json --arch amd64 --product-version "$V.0" --file-version "$V.0"
      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/WeeJ.exe .

      - name: Zip
        run: |
          cp LICENSE dist/LICENSE
          (cd dist && 7z a -tzip "WeeJ-$V-x64.zip" WeeJ.exe LICENSE)
          rm dist/LICENSE

      - name: Install Inno Setup
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            choco install innosetup -y --no-progress
          fi

      - name: Build the installer
        # Git Bash rewrites arguments that start with / as paths, which mangles ISCC's /D and /O.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          exe_win=$(cygpath -w "$(pwd)/dist/WeeJ.exe")
          dist_win=$(cygpath -w "$(pwd)/dist")
          "$iscc" "/DAppVersion=$V" "/DSourceExe=$exe_win" "/O$dist_win" installer/weej.iss

      - name: Fixed-name copies, checksums and latest.json
        run: |
          cp "dist/WeeJ-$V-x64.zip" dist/WeeJ-x64.zip
          cp "dist/WeeJ-$V-x64-setup.exe" dist/WeeJ-x64-setup.exe
          sha256=$(sha256sum "dist/WeeJ-$V-x64.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s"}}\n' "$V" "$sha256" > dist/latest.json
          (cd dist && sha256sum "WeeJ-$V-x64.zip" "WeeJ-$V-x64-setup.exe" > SHA256SUMS)

      - name: Publish the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/WeeJ-$V-x64-setup.exe" \
            "dist/WeeJ-$V-x64.zip" \
            "dist/WeeJ-x64-setup.exe" \
            "dist/WeeJ-x64.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "WeeJ $V" --generate-notes

      - name: Upload the build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: WeeJ-${{ env.V }}-build
          retention-days: 14
          path: |
            dist/WeeJ.exe
            dist/WeeJ-${{ env.V }}-x64-setup.exe
            dist/WeeJ-${{ env.V }}-x64.zip
