name: Release
# A push to main whose AppVersion isn't released yet publishes it, and so does a v* tag. A pull request that
# touches the release only builds it.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag check needs main's history
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/core/version.go)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            if [ "$tag" != "v$v" ]; then
              echo "::error::Tag $tag does not match AppVersion $v in internal/core/version.go." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $tag is not on main. Merge to main first." >&2
              exit 1
            fi
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$v is already released."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # 32-bit binaries run on this 64-bit runner, so the 386 tests run for real.
      - name: Test
        run: |
          go test ./...
          GOARCH=386 go test ./...
      - run: go run ./tools/mkicon winres
      - name: Make resources
        run: go tool go-winres make --in winres/winres.json --arch amd64,386 --product-version "$V.0" --file-version "$V.0"
      - name: Build
        run: |
          mkdir -p dist/x64 dist/x86
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/x64/WeeJ.exe .
          CGO_ENABLED=0 GOARCH=386 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/x86/WeeJ.exe .

      - name: Zip
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            Compress-Archive -Path "dist/$arch/WeeJ.exe", LICENSE -DestinationPath "dist/WeeJ-$env:V-$arch.zip"
          }

      # PowerShell, not bash: Git Bash would rewrite ISCC's /switches as paths.
      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:V" "/DArch=$arch" "/DSourceExe=..\dist\$arch\WeeJ.exe" installer\weej.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Checksums and latest.json
        run: |
          x64=$(sha256sum "dist/WeeJ-$V-x64.zip" | cut -d ' ' -f1)
          x86=$(sha256sum "dist/WeeJ-$V-x86.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s","x86":"%s"}}\n' "$V" "$x64" "$x86" > dist/latest.json
          (cd dist && sha256sum "WeeJ-$V-x64.zip" "WeeJ-$V-x64-setup.exe" "WeeJ-$V-x86.zip" "WeeJ-$V-x86-setup.exe" > SHA256SUMS)

      - name: Upload the build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: WeeJ-${{ env.V }}-build
          retention-days: 14
          path: |
            dist/WeeJ-${{ env.V }}-x64-setup.exe
            dist/WeeJ-${{ env.V }}-x64.zip
            dist/WeeJ-${{ env.V }}-x86-setup.exe
            dist/WeeJ-${{ env.V }}-x86.zip
            dist/latest.json
            dist/SHA256SUMS

  publish:
    name: Publish the release
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    # z's Mac, where gh is logged in as zolferfigueiredo: the release is zolferfigueiredo's, not github-actions[bot]'s.
    runs-on: [self-hosted, macOS, release]
    timeout-minutes: 5
    env:
      V: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WeeJ-${{ env.V }}-build
          path: dist
      # On a push to main this also makes the v tag, on the commit that was built.
      - name: Publish the release
        run: |
          gh release create "v$V" \
            "dist/WeeJ-$V-x64-setup.exe" \
            "dist/WeeJ-$V-x64.zip" \
            "dist/WeeJ-$V-x86-setup.exe" \
            "dist/WeeJ-$V-x86.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WeeJ $V" --generate-notes
          rm -rf dist
