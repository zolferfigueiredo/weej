name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check below needs main's history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the tag
        run: |
          v=$(sed -n 's/^const AppVersion = "\(.*\)"$/\1/p' internal/core/version.go)
          tag=${GITHUB_REF#refs/tags/}
          if [ "$tag" != "v$v" ]; then
            echo "::error::Tag $tag does not match AppVersion $v in internal/core/version.go." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is not on main. Merge to main first, then run release.bat there." >&2
            exit 1
          fi
          echo "V=$v" >> "$GITHUB_ENV"

      # 32-bit binaries run on this 64-bit runner, so the 386 tests run for real.
      - name: Test
        run: |
          go test ./...
          GOARCH=386 go test ./...
      - run: go run ./tools/mkicon winres
      - name: Make resources
        run: go tool go-winres make --in winres/winres.json --arch amd64,386 --product-version "$V.0" --file-version "$V.0"
      - name: Build
        run: |
          mkdir -p dist/x64 dist/x86
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/x64/WeeJ.exe .
          CGO_ENABLED=0 GOARCH=386 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/x86/WeeJ.exe .

      - name: Zip
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            Compress-Archive -Path "dist/$arch/WeeJ.exe", LICENSE -DestinationPath "dist/WeeJ-$env:V-$arch.zip"
          }

      # PowerShell, not bash: Git Bash would rewrite ISCC's /switches as paths.
      - name: Build the installers
        shell: pwsh
        run: |
          foreach ($arch in 'x64', 'x86') {
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:V" "/DArch=$arch" "/DSourceExe=..\dist\$arch\WeeJ.exe" installer\weej.iss
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Checksums and latest.json
        run: |
          x64=$(sha256sum "dist/WeeJ-$V-x64.zip" | cut -d ' ' -f1)
          x86=$(sha256sum "dist/WeeJ-$V-x86.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s","x86":"%s"}}\n' "$V" "$x64" "$x86" > dist/latest.json
          (cd dist && sha256sum "WeeJ-$V-x64.zip" "WeeJ-$V-x64-setup.exe" "WeeJ-$V-x86.zip" "WeeJ-$V-x86-setup.exe" > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/WeeJ-$V-x64-setup.exe" \
            "dist/WeeJ-$V-x64.zip" \
            "dist/WeeJ-$V-x86-setup.exe" \
            "dist/WeeJ-$V-x86.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "WeeJ $V" --generate-notes
